<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netwatch — sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    width: 340px;
    max-width: 90vw;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
  }
  .login-card img { width: 48px; height: 48px; margin-bottom: 14px; }
  .login-card h1 {
    font-family: var(--display);
    font-size: 18px;
    margin: 0 0 24px;
    color: var(--text);
  }
  .login-card input {
    width: 100%;
    box-sizing: border-box;
    background: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--cyan); }
  .login-card button {
    width: 100%;
    background: var(--cyan);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .login-card button:hover { opacity: 0.9; }
  .login-error {
    color: var(--red);
    font-size: 13px;
    margin: -8px 0 14px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <img src="/static/icon.svg" alt="">
    <h1>netwatch</h1>
    <form method="POST" action="/login">
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
