<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- radar sweep rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1c2430" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#1c2430" stroke-width="1.5"/>

  <!-- connection lines from hub to nodes -->
  <line x1="32" y1="32" x2="32" y2="10" stroke="#5eeaea" stroke-width="1.6" opacity="0.55"/>
  <line x1="32" y1="32" x2="50.5" y2="41" stroke="#5eeaea" stroke-width="1.6" opacity="0.55"/>
  <line x1="32" y1="32" x2="13.5" y2="41" stroke="#5eeaea" stroke-width="1.6" opacity="0.35"/>

  <!-- device nodes -->
  <circle cx="32" cy="10" r="4" fill="#0a0e14" stroke="#5eeaea" stroke-width="2"/>
  <circle cx="50.5" cy="41" r="4" fill="#0a0e14" stroke="#5eeaea" stroke-width="2"/>
  <circle cx="13.5" cy="41" r="4" fill="#0a0e14" stroke="#6c7a8c" stroke-width="2"/>

  <!-- hub -->
  <circle cx="32" cy="32" r="6.5" fill="#0a0e14" stroke="#f2a65a" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="2" fill="#f2a65a"/>
</svg>
